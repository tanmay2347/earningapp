<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offer Details - EarningApp</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            padding-bottom: 120px;
        }
        .back-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
        .back-btn { background: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 18px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        
        .top-card, .instruction-card, .upload-card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        .top-card { display: flex; justify-content: space-between; align-items: center; }
        .top-logo { width: 60px; height: 60px; border-radius: 12px; object-fit: contain; background: #f8f9fa; }
        
        .step-item { display: flex; align-items: flex-start; gap: 12px; margin: 15px 0; font-size: 15px; color: #444; font-weight: 500; line-height: 1.4; }
        .step-dot { width: 10px; height: 10px; background: #26a69a; border-radius: 50%; margin-top: 6px; flex-shrink: 0; }
        
        .upload-card { display: none; text-align: center; border: 2px dashed #00796b; background: #f4fdfc; }
        
        .action-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 450px; }
        .btn-main {
            width: 100%;
            background: #00796b;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 30px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 121, 107, 0.4);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="back-header">
        <button class="back-btn" onclick="history.back()">←</button>
        <div style="background: white; padding: 6px 14px; border-radius: 20px; font-weight: bold;">🪙 Wallet</div>
    </div>

    <div class="top-card">
        <div>
            <h2 id="taskTitle" style="margin:0 0 5px 0; font-size:20px;">Loading...</h2>
            <div style="margin-top: 10px; background: #e0f2f1; color: #00796b; padding: 6px 12px; border-radius: 10px; display: inline-block; font-weight: bold;" id="taskReward">🪙 ₹0</div>
        </div>
        <img id="taskLogo" src="" alt="Logo" class="top-logo">
    </div>

    <!-- Point-wise Instructions Card -->
    <div class="instruction-card">
        <h3 style="margin-top:0; color:#222; font-size:17px;">📋 Follow the instructions below:</h3>
        <hr style="border: 0; border-top: 1px dashed #ddd; margin: 15px 0;">
        <div id="taskInstructionsList">
            <div class="step-item"><div class="step-dot"></div><span>Loading instructions...</span></div>
        </div>
    </div>

    <!-- Screenshot Upload Section -->
    <div id="uploadSection" class="upload-card">
        <h3 style="margin-top:0; color:#00796b;">📸 Upload Proof Screenshot</h3>
        <p style="font-size: 13px; color: #555; margin-bottom: 20px;">Upload task completion screenshot for admin verification.</p>
        
        <div style="margin-bottom: 20px;">
            <label for="proofImage" style="background: #e0f2f1; color: #00796b; padding: 12px 24px; border-radius: 25px; font-weight: bold; cursor: pointer; display: inline-block; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
                📁 Choose Screenshot
            </label>
            <input type="file" id="proofImage" accept="image/*" style="display: none;" onchange="updateFileName(this)">
            <p id="fileNameDisplay" style="font-size: 13px; color: #666; margin-top: 8px;">No file chosen</p>
        </div>

        <button onclick="submitTaskProof()" class="btn-main" style="background: #28a745;">Submit For Verification 🚀</button>
    </div>

    <div class="action-bar" id="actionBar">
        <button onclick="openTaskLink()" class="btn-main">Install Now & Complete 🔗</button>
    </div>

    <script>
        const userEmail = localStorage.getItem('userEmail');
        if (!userEmail && localStorage.getItem('isAdmin') !== 'true') {
            window.location.href = 'login.html';
        }

        const urlParams = new URLSearchParams(window.location.search);
        const title = urlParams.get('title');
        const desc = urlParams.get('desc'); // Admin dwara dala gaya point-wise text
        const reward = urlParams.get('reward');
        const logo = urlParams.get('logo');
        const link = urlParams.get('link');

        document.getElementById('taskTitle').innerText = title || 'Task Offer';
        document.getElementById('taskReward').innerText = '🪙 ₹' + (reward || 0);
        document.getElementById('taskLogo').src = logo || 'https://via.placeholder.com/60';

        // Admin ke description ko line-by-line tod kar point-wise display karna
        const instructionContainer = document.getElementById('taskInstructionsList');
        if (desc && desc.trim() !== '') {
            instructionContainer.innerHTML = '';
            const points = desc.split('\n');
            points.forEach(point => {
                if (point.trim() !== '') {
                    instructionContainer.innerHTML += `
                        <div class="step-item">
                            <div class="step-dot"></div>
                            <span>${point}</span>
                        </div>
                    `;
                }
            });
        } else {
            instructionContainer.innerHTML = `
                <div class="step-item"><div class="step-dot"></div><span>Complete the task as per instructions</span></div>
                <div class="step-item"><div class="step-dot"></div><span>Take screenshot proof</span></div>
                <div class="step-item"><div class="step-dot"></div><span>Upload proof and submit</span></div>
            `;
        }

        function updateFileName(input) {
            const fileNameDisplay = document.getElementById('fileNameDisplay');
            if (input.files && input.files.length > 0) {
                fileNameDisplay.innerText = "Selected: " + input.files[0].name;
                fileNameDisplay.style.color = "#28a745";
                fileNameDisplay.style.fontWeight = "bold";
            } else {
                fileNameDisplay.innerText = "No file chosen";
                fileNameDisplay.style.color = "#666";
                fileNameDisplay.style.fontWeight = "normal";
            }
        }

        function openTaskLink() {
            if (!link) {
                alert("Invalid tracking link!");
                return;
            }
            window.open(link, '_blank');

            document.getElementById('actionBar').style.display = 'none';
            document.getElementById('uploadSection').style.display = 'block';
            alert("Now complete the task, take a screenshot, and upload it below!");
        }

        async function submitTaskProof() {
            const fileInput = document.getElementById('proofImage');
            if (fileInput.files.length === 0) {
                alert("Please select a screenshot first!");
                return;
            }

            const file = fileInput.files[0];
            const submitBtn = document.querySelector('#uploadSection button');
            submitBtn.innerText = "Processing Image...";
            submitBtn.disabled = true;

            const reader = new FileReader();
            reader.readAsDataURL(file);

            reader.onload = function(event) {
                const img = new Image();
                img.src = event.target.result;

                img.onload = async function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    
                    const max_size = 800;
                    if (width > height) {
                        if (width > max_size) {
                            height *= max_size / width;
                            width = max_size;
                        }
                    } else {
                        if (height > max_size) {
                            width *= max_size / height;
                            height = max_size;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

                    submitBtn.innerText = "Uploading to Server...";

                    try {
                        const res = await fetch('/api/submit-task', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                userEmail: userEmail,
                                taskTitle: title,
                                rewardAmount: Number(reward),
                                proofImage: compressedBase64
                            })
                        });
                        const data = await res.json();
                        alert(data.message || "Submitted successfully!");
                        if(data.success) {
                            window.location.href = 'index.html';
                        } else {
                            submitBtn.innerText = "Submit For Verification 🚀";
                            submitBtn.disabled = false;
                        }
                    } catch (err) {
                        console.error(err);
                        alert("Error submitting task proof! Check your mobile internet connection.");
                        submitBtn.innerText = "Submit For Verification 🚀";
                        submitBtn.disabled = false;
                    }
                }
            };

            reader.onerror = function() {
                alert("Failed to read image file!");
                submitBtn.innerText = "Submit For Verification 🚀";
                submitBtn.disabled = false;
            };
        }
    </script>
</body>
</html>
