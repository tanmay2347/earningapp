<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup - EarningApp</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(135deg, #e0f2f1 0%, #00796b 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background: white;
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            text-align: center;
        }

        .app-logo-text {
            font-size: 26px;
            font-weight: bold;
            color: #00796b;
            margin-bottom: 5px;
        }

        .app-subtitle {
            font-size: 13px;
            color: #666;
            margin-bottom: 20px;
        }

        /* Tab Switcher (Login / Signup) */
        .auth-tabs {
            display: flex;
            background: #f1f3f5;
            border-radius: 20px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .auth-tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            padding: 10px;
            border-radius: 16px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            color: #555;
            transition: 0.3s;
        }
        .auth-tab-btn.active {
            background: #00796b;
            color: white;
            box-shadow: 0 2px 6px rgba(0,121,107,0.3);
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #444;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ced4da;
            border-radius: 12px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }
        .form-group input:focus {
            border-color: #00796b;
        }

        .auth-btn {
            width: 100%;
            background: #00796b;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 121, 107, 0.3);
            margin-top: 10px;
        }

        #errorMsg {
            color: #dc3545;
            font-size: 13px;
            margin-top: 12px;
            font-weight: 600;
            display: none;
        }
        #successMsg {
            color: #28a745;
            font-size: 13px;
            margin-top: 12px;
            font-weight: 600;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="app-logo-text">⚡ EarningApp</div>
        <div class="app-subtitle" id="formSubtitle">Secure Login to your account</div>

        <!-- Mode Switcher Tabs -->
        <div class="auth-tabs">
            <button class="auth-tab-btn active" id="loginTabBtn" onclick="switchMode('login')">Login</button>
            <button class="auth-tab-btn" id="signupTabBtn" onclick="switchMode('signup')">Sign Up</button>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="emailInput" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="passwordInput" placeholder="Enter your password" required>
        </div>

        <button class="auth-btn" id="actionBtn" onclick="handleSubmit()">Login</button>

        <div id="errorMsg"></div>
        <div id="successMsg"></div>
    </div>

    <script>
        let currentMode = 'login'; // 'login' or 'signup'

        function switchMode(mode) {
            currentMode = mode;
            const loginBtn = document.getElementById('loginTabBtn');
            const signupBtn = document.getElementById('signupTabBtn');
            const actionBtn = document.getElementById('actionBtn');
            const subtitle = document.getElementById('formSubtitle');

            hideMessages();

            if (mode === 'login') {
                loginBtn.classList.add('active');
                signupBtn.classList.remove('active');
                actionBtn.innerText = 'Login';
                subtitle.innerText = 'Secure Login to your account';
            } else {
                signupBtn.classList.add('active');
                loginBtn.classList.remove('active');
                actionBtn.innerText = 'Sign Up';
                subtitle.innerText = 'Create a new secure account';
            }
        }

        async function handleSubmit() {
            hideMessages();
            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();

            if (!email || !email.includes('@')) {
                showError("Please enter a valid email address!");
                return;
            }
            if (!password || password.length < 4) {
                showError("Password must be at least 4 characters long!");
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const refBy = urlParams.get('ref') || '';

            const endpoint = currentMode === 'login' ? '/api/login' : '/api/signup';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password, referredBy: refBy })
                });
                const data = await res.json();

                if (data.success) {
                    if (currentMode === 'signup') {
                        showSuccess(data.message || "Account created successfully! Please login.");
                        setTimeout(() => switchMode('login'), 1500);
                        return;
                    }

                    localStorage.setItem('userEmail', email);
                    
                    if (email.toLowerCase() === 'admin@earningapp.com') {
                        localStorage.setItem('isAdmin', 'true');
                        window.location.href = 'admin.html';
                    } else {
                        localStorage.removeItem('isAdmin');
                        window.location.href = 'index.html';
                    }
                } else {
                    showError(data.message || "Authentication failed!");
                }
            } catch (err) {
                console.error(err);
                showError("Server connection error!");
            }
        }

        function showError(msg) {
            const errDiv = document.getElementById('errorMsg');
            errDiv.innerText = msg;
            errDiv.style.display = 'block';
        }

        function showSuccess(msg) {
            const succDiv = document.getElementById('successMsg');
            succDiv.innerText = msg;
            succDiv.style.display = 'block';
        }

        function hideMessages() {
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('successMsg').style.display = 'none';
        }
    </script>
</body>
</html>
