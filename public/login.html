<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EarningApp</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(135deg, #e0f2f1 0%, #00796b 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background: white;
            padding: 40px 30px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            text-align: center;
        }

        .app-logo-text {
            font-size: 26px;
            font-weight: bold;
            color: #00796b;
            margin-bottom: 8px;
        }

        .app-subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }

        .manual-section {
            margin-top: 15px;
            text-align: left;
        }
        .manual-section label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #444;
            margin-bottom: 6px;
        }
        .manual-section input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ced4da;
            border-radius: 12px;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 15px;
            outline: none;
        }
        .manual-btn {
            width: 100%;
            background: #00796b;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 121, 107, 0.3);
        }

        #errorMsg {
            color: #dc3545;
            font-size: 13px;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="app-logo-text">⚡ EarningApp</div>
        <div class="app-subtitle">Sign in with your Email to continue</div>

        <div class="manual-section">
            <label>Email Address</label>
            <input type="email" id="manualEmail" placeholder="name@example.com">
            <button class="manual-btn" onclick="handleManualLogin()">Login / Sign Up</button>
        </div>

        <div id="errorMsg"></div>
    </div>

    <script>
        async function handleManualLogin() {
            const email = document.getElementById('manualEmail').value.trim();
            const errorDiv = document.getElementById('errorMsg');

            if (!email || !email.includes('@')) {
                errorDiv.innerText = "Please enter a valid email address!";
                errorDiv.style.display = 'block';
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const refBy = urlParams.get('ref') || '';

            try {
                const res = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, referredBy: refBy })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('userEmail', email);
                    
                    // Agar Admin email hai toh admin panel par bhejenge, warna customer home par
                    if (email.toLowerCase() === 'admin@earningapp.com') {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'index.html';
                    }
                } else {
                    errorDiv.innerText = data.message || "Login failed!";
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.innerText = "Server connection error!";
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
