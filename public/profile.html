    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - EarningApp</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background: linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding-bottom: 100px;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }
        .profile-title {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 22px;
            font-weight: bold;
            color: #111;
        }
        .back-btn {
            background: white;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .top-wallet-box {
            display: flex;
            align-items: center;
            background: white;
            padding: 6px 14px;
            border-radius: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            font-weight: bold;
            font-size: 15px;
            gap: 6px;
        }

        /* Profile Card */
        .profile-card {
            background: white;
            width: 90%;
            max-width: 450px;
            margin: 10px auto 20px auto;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .user-details-box {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-bottom: 15px;
            border-bottom: 1px dashed #ddd;
        }
        .user-avatar-lg {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
        }
        .user-text h3 { margin: 0 0 4px 0; font-size: 18px; color: #222; }
        .user-text p { margin: 0; font-size: 12px; color: #777; }

        .earnings-stats {
            display: flex;
            justify-content: space-around;
            padding-top: 15px;
            text-align: center;
        }
        .stat-box h4 { margin: 0; font-size: 20px; color: #00796b; }
        .stat-box p { margin: 4px 0 0 0; font-size: 12px; color: #666; font-weight: 600; }

        /* Settings List */
        .settings-section {
            width: 90%;
            max-width: 450px;
            margin: auto;
        }
        .settings-section h2 { font-size: 20px; color: #111; margin-bottom: 15px; }
        
        .setting-item {
            background: white;
            border-radius: 16px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            cursor: pointer;
            text-decoration: none;
            color: #222;
            font-weight: 600;
            font-size: 15px;
        }
        .setting-left { display: flex; align-items: center; gap: 12px; }
        .setting-item span { color: #888; font-size: 18px; }

        /* Bottom Floating Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 450px;
            background: #00796b;
            border-radius: 30px;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            box-shadow: 0 5px 20px rgba(0, 121, 107, 0.3);
            z-index: 1000;
        }
        .nav-item {
            color: rgba(255,255,255,0.7);
            text-align: center;
            font-size: 11px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            cursor: pointer;
        }
        .nav-item.active {
            background: rgba(255, 255, 255, 0.2);
            padding: 6px 16px;
            border-radius: 20px;
            color: white;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="profile-title">
            <button class="back-btn" onclick="window.location.href='index.html'">←</button>
            Profile
        </div>
        <div class="top-wallet-box">
            <span>🪙</span> <span id="walletBalance">₹0</span>
        </div>
    </header>

    <!-- Profile Main Card -->
    <div class="profile-card">
        <div class="user-details-box">
            <img src="banner.jpg" alt="Profile" class="user-avatar-lg" onerror="this.src='https://via.placeholder.com/60'">
            <div class="user-text">
                <h3 id="profileName">Tanmay</h3>
                <p id="profilePhone">Loading...</p>
            </div>
        </div>
        <div class="earnings-stats">
            <div class="stat-box">
                <h4 id="totalEarnedVal">₹0</h4>
                <p>Total Earned</p>
            </div>
            <div style="border-right: 1px dashed #ddd;"></div>
            <div class="stat-box">
                <h4 id="totalWithdrawnVal">₹0</h4>
                <p>Total Withdrawn</p>
            </div>
        </div>
    </div>

    <!-- Settings List -->
    <div class="settings-section">
        <h2>Settings</h2>

        <div class="setting-item" onclick="alert('Thank you for rating us!')">
            <div class="setting-left">⭐ Rate Us</div>
            <span>➔</span>
        </div>

        <div class="setting-item">
            <div class="setting-left">📍 Location</div>
            <span style="font-size: 13px; background: #e0f2f1; padding: 4px 10px; border-radius: 10px; color: #00796b;">Chandur, India</span>
        </div>

        <a href="https://t.me/earning_app_247_bot" target="_blank" class="setting-item">
            <div class="setting-left">📢 Join Telegram</div>
            <span>➔</span>
        </a>

        <a href="terms.html" class="setting-item">
            <div class="setting-left">📄 Terms of Service</div>
            <span>➔</span>
        </a>

        <div class="setting-item" onclick="logoutUser()" style="color: #dc3545;">
            <div class="setting-left">🚪 Logout</div>
            <span>➔</span>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><span>🏠</span><span>Home</span></a>
        <a href="earn.html" class="nav-item"><span>🪙</span><span>Earn</span></a>
        <a onclick="openReferModal()" class="nav-item"><span>👥</span><span>Refer</span></a>
        <a onclick="openWithdrawModal()" class="nav-item"><span>👛</span><span>Wallet</span></a>
        <a href="profile.html" class="nav-item active"><span>👤</span><span>Profile</span></a>
    </nav>

    <script>
        const phone = localStorage.getItem('userPhone');

        window.addEventListener('DOMContentLoaded', () => {
            if (phone) {
                document.getElementById('profilePhone').innerText = phone;
                fetchUserData();
            }
        });

        async function fetchUserData() {
            try {
                const res = await fetch(`/api/user/wallet/${phone}`);
                const data = await res.json();
                if (data.success) {
                    document.getElementById('walletBalance').innerText = '₹' + data.wallet;
                    document.getElementById('totalEarnedVal').innerText = '₹' + data.wallet;
                }
            } catch (err) { console.error(err); }
        }

        function logoutUser() {
            localStorage.clear();
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
